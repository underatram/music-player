<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4.500v16H6zM13.500 4H18v16h-4.500z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M15.500 5H18v14h-2.500zM4 5l10.500 7L4 19z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5h2.500v14H6zM20 5v14L9.500 12z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3.500c1.800 0 3.300.9 4.300 2.400l2.400 5.200c1 1.500 2.500 2.400 4.300 2.400H20M3 17h3.500c1.800 0 3.300-.9 4.300-2.400M13.200 9.400C14.200 7.900 15.700 7 17.500 7H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18 3.500 22 7l-4 3.500zM18 13.500l4 3.500-4 3.500z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-eject" viewBox="0 0 24 24"><path d="M12 5l7 9H5zM5 17h14v2.500H5z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2.500 20.500 6 17 9.500M3.500 11V9.500A3.500 3.500 0 0 1 7 6h13.500M7 21.500 3.500 18 7 14.500M20.500 13v1.500a3.500 3.500 0 0 1-3.500 3.500H3.500" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.500S3.500 15.500 3.500 9.200A4.700 4.700 0 0 1 12 6.500a4.700 4.700 0 0 1 8.500 2.700c0 6.300-8.500 11.300-8.500 11.300z"/></symbol>
    <symbol id="i-playlist" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7M17 21a2.500 2.500 0 1 0 0-5 2.500 2.500 0 0 0 0 5zM19.500 18.500V11" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3.500 2" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20v-6M12 20V5M19 20v-9" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round"/></symbol>
    <symbol id="i-mini" viewBox="0 0 24 24"><path d="M10 15v5M10 15H5M10 15l-6 6M14 9V4M14 9h5M14 9l6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 6h16M4 12h9M4 18h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16 11.500v8l6-4z"/></symbol>
    <symbol id="i-artist" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM5 20c.8-3.500 3.600-5 7-5s6.200 1.500 7 5" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-album" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 9.500a2.500 2.500 0 1 0 0 5 2.500 2.500 0 0 0 0-5z" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-genre" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM19 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-year" viewBox="0 0 24 24"><path d="M5 6h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zM4 10.500h16M8 3.500v4M16 3.500v4" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4.500V4.500L8 9z"/><path d="M16 8.500a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </svg>

  <div class="shell">
    <header class="top">
      <div class="buttons">
        <button id="shuffle" class="ctl ctl-toggle" aria-label="Shuffle" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-shuffle"/></svg></button>
        <button id="prev" class="ctl" aria-label="Previous track" disabled><svg class="icon" aria-hidden="true"><use href="#i-prev"/></svg></button>
        <button id="play" class="ctl ctl-play" aria-label="Play" disabled><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg></button>
        <button id="next" class="ctl" aria-label="Next track" disabled><svg class="icon" aria-hidden="true"><use href="#i-next"/></svg></button>
        <button id="repeat" class="ctl ctl-toggle ctl-repeat" aria-label="Repeat is off" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-repeat"/></svg></button>
      </div>

      <div class="display">
        <img id="now-art" class="cover cover-now" alt="" hidden>
        <div class="display-text">
          <button id="now-title" class="now-title" disabled>Nothing playing</button>
          <div id="now-detail" class="now-detail"></div>
          <div class="progress">
            <span id="time-now" class="time">0:00</span>
            <input id="seek" class="slider" type="range" min="0" max="1" step="0.1" value="0" aria-label="Seek" disabled>
            <span id="time-total" class="time">0:00</span>
          </div>
        </div>
        <button id="now-heart" class="ctl ctl-heart" aria-label="Favourite" aria-pressed="false" disabled><svg class="icon" aria-hidden="true"><use href="#i-heart"/></svg></button>
        <button id="queue-toggle" class="ctl ctl-queue" aria-label="Up Next" title="Up Next" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-queue"/></svg></button>
        <button id="mini-toggle" class="ctl ctl-mini" hidden></button>
      </div>

      <div class="volume">
        <svg class="icon" aria-hidden="true"><use href="#i-volume"/></svg>
        <input id="volume" class="slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      </div>
    </header>

    <div class="body">
      <aside class="side">
        <button id="shelf-button" class="shelf-button" aria-haspopup="menu" aria-expanded="false" aria-label="Choose a library">
          <span id="shelf-label">Music</span>
          <svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg>
        </button>
        <input id="search" class="search" type="search" placeholder="Search music" aria-label="Search music" autocomplete="off">
        <nav id="nav" class="nav" aria-label="Library"></nav>
        <section id="playlists" class="playlists" aria-label="Playlists" hidden></section>
        <section id="devices" class="devices" aria-label="Devices" hidden></section>
        <div class="side-foot">
          <p id="scan-status" class="scan-status" role="status"></p>
          <button id="manage-library" class="link-button" aria-haspopup="menu" aria-expanded="false" hidden>Manage Library</button>
        </div>
      </aside>

      <main id="scroller" class="main">
        <div id="content" class="content"></div>
      </main>

      <aside id="queue" class="queue" aria-label="Up Next" hidden></aside>
    </div>
  </div>

  <input id="folder-input" type="file" webkitdirectory multiple hidden>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/db.js"></script>
  <script src="js/tags.js"></script>
  <script src="js/library.js"></script>
  <script src="js/player.js"></script>
  <script src="js/host.js"></script>
  <script src="js/userdata.js"></script>
  <script src="js/covers.js"></script>
  <script src="js/marquee.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
